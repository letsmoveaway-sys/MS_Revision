name: Publish exam simulator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'exam-simulator/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate question banks
        run: |
          node scripts/validate-exams.js exams/ab-731.js
          node scripts/validate-exams.js exams/ab-900.js
          node scripts/validate-exams.js exams/sc-500.js
          node scripts/validate-exams.js exams/ai-103.js
          node scripts/validate-exams.js exams/ai-901.js
        working-directory: exam-simulator
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: exam-simulator

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
